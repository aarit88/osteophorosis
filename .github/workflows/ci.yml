name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=dot
      - run: npm run lint
      - run: npm run build

  frontend-e2e:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e

  python-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: Governance and API regression tests
        run: >-
          python -m pytest -q
          ml_service/tests/test_track_d_intake.py
          ml_service/tests/test_stage34_ontology_adjudication.py
          ml_service/tests/test_stage35_acquisition_governance.py
          ml_service/tests/test_stage_31_application_integration.py
          ml_service/tests/test_security_api_contracts.py
          ml_service/tests/test_deployment_health.py
          ml_service/tests/test_stage38_cohort_onboarding.py
          ml_service/tests/test_stage39_dataset_preparation.py
          ml_service/tests/test_stage40_source_qualification.py
          ml_service/tests/test_track_a_scan_api.py
          ml_service/tests/test_checkpoint_inventory.py
          ml_service/tests/test_zero_dataset_guardrails.py
          ml_service/tests/test_deployment_smoke_script.py
      - name: Live FastAPI and Express deployment smoke
        run: npm run test:deployment

  deployment-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose and build local research images
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose build
