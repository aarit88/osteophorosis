openapi: 3.1.0
info:
  title: OsteoGuard AI Inference & Audit API
  version: 1.0.0
  description: >
    Explainable deep learning & radiomics API for 4-class bone pathology classification
    (Metastasis, Paget's Disease, Osteogenesis Imperfecta, Healthy Bone) with Grad-CAM,
    SHAP attribution, entropy-based uncertainty estimation, and clinician audit trails.
servers:
  - url: http://localhost:3000
    description: Unified Full-Stack Dev Server
  - url: http://localhost:8787
    description: Standalone Mock API Server

paths:
  /api/health:
    get:
      summary: Health check & operating mode
      operationId: getHealth
      responses:
        '200':
          description: Operational status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/analyze:
    post:
      summary: Multi-class bone pathology inference with explainability
      operationId: analyzeImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Planar radiograph, CT bone window slice, or bone scan
                modality:
                  type: string
                  enum: [xray, ct, bone_scan]
                  default: xray
      responses:
        '200':
          description: Successful diagnostic prediction with Grad-CAM and SHAP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
        '400':
          description: Validation error in uploaded file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal processing or simulation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/feedback:
    post:
      summary: Clinician-in-the-loop feedback capture (EU AI Act Art. 14 audit)
      operationId: submitFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackPayload'
      responses:
        '200':
          description: Feedback recorded into audit ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  feedbackId:
                    type: string
        '400':
          description: Invalid feedback request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/feedback/stats:
    get:
      summary: Get aggregate clinical agreement statistics
      operationId: getFeedbackStats
      responses:
        '200':
          description: Aggregated audit counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackStatsResponse'

  /api/v1/feedback/list:
    get:
      summary: Retrieve raw feedback ledger entries
      operationId: getFeedbackList
      responses:
        '200':
          description: List of audit records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeedbackRecord'

  /api/v1/events:
    post:
      summary: Lightweight telemetry event logger for usability instrumentation
      operationId: logEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPayload'
      responses:
        '200':
          description: Event logged
          content:
            application/json:
              schema:
                type: object
                properties:
                  logged:
                    type: boolean

  /api/v1/jobs/{id}:
    get:
      summary: Poll status of asynchronous deep learning inference job
      operationId: getJobStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status and progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'

  /api/v1/datasets/sources:
    get:
      summary: Stage 35 Institutional Dataset Source Registry
      operationId: getDatasetSources
      responses:
        '200':
          description: Centralized source registry across 4 cohorts with evidence and status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSourcesResponse'

  /api/v1/datasets/acquisition-status:
    get:
      summary: Stage 35 Cohort Acquisition Workflow Status
      operationId: getDatasetAcquisitionStatus
      responses:
        '200':
          description: Per-cohort workflow progress, modality counts, and blockers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetAcquisitionStatusResponse'

  /api/v1/datasets/governance-status:
    get:
      summary: Stage 35 Institutional Ethics, DUA & Governance Status
      operationId: getDatasetGovernanceStatus
      responses:
        '200':
          description: Pending IRB/DUA/expiry audit summary and draft request templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetGovernanceStatusResponse'

  /api/v1/datasets/cohort-planning:
    get:
      summary: Stage 35 Planned vs Actual Cohort Readiness
      operationId: getCohortPlanning
      responses:
        '200':
          description: Planned target counts vs live on-disk validated clinical sample counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortPlanningResponse'

  /api/v1/datasets/workflow/transition:
    post:
      summary: Stage 35 Audited Acquisition Workflow Transition Validation
      operationId: transitionDatasetWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTransitionRequest'
      responses:
        '200':
          description: Transition validated against role, sequential order, evidence, and expiry guards
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid Bearer token when OSTEO_CLINICAL_API_TOKEN is configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Unauthorized governance reviewer role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown dataset source_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid transition sequence, expired governance approval, or missing evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - mode
      properties:
        status:
          type: string
          example: ok
        mode:
          type: string
          enum: [simulation, production]
          example: simulation

    AnalyzeResponse:
      type: object
      required:
        - requestId
        - timestamp
        - modality
        - imageUrl
        - gradcamUrl
        - prediction
        - uncertaintyDetail
        - shap
        - counterfactuals
        - fractureRisk
        - disclaimer
      properties:
        requestId:
          type: string
          example: req_506842b450dc
        timestamp:
          type: string
          format: date-time
        modality:
          type: string
          enum: [xray, ct, bone_scan]
        imageUrl:
          type: string
        gradcamUrl:
          type: string
        prediction:
          $ref: '#/components/schemas/PredictionResult'
        uncertaintyDetail:
          $ref: '#/components/schemas/UncertaintyDetail'
        shap:
          type: array
          items:
            $ref: '#/components/schemas/ShapFeature'
        counterfactuals:
          type: array
          items:
            $ref: '#/components/schemas/Counterfactual'
        fractureRisk:
          $ref: '#/components/schemas/FractureRiskResult'
        disclaimer:
          type: string

    PredictionResult:
      type: object
      required:
        - topClass
        - confidence
        - probabilities
        - uncertainty
      properties:
        topClass:
          type: string
          enum: [metastasis, paget, oi, healthy]
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        probabilities:
          type: object
          properties:
            metastasis:
              type: number
            paget:
              type: number
            oi:
              type: number
            healthy:
              type: number
        uncertainty:
          type: string
          enum: [low, medium, high]

    UncertaintyDetail:
      type: object
      required:
        - entropy
        - confidenceInterval
        - oodFlag
        - calibrationBin
      properties:
        entropy:
          type: number
          description: Normalized Shannon entropy across the 4 Softmax classes (0-1)
          example: 0.28
        confidenceInterval:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          description: 95% Clopper-Pearson or empirical bootstrap interval [lower, upper]
          example: [0.72, 0.85]
        oodFlag:
          type: boolean
          description: Out-Of-Distribution detector flag triggering diagnostic abstention
          example: false
        calibrationBin:
          type: object
          properties:
            predicted:
              type: number
            observed:
              type: number

    ShapFeature:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
        value:
          type: number

    Counterfactual:
      type: object
      required:
        - feature
        - deltaDirection
        - percentChange
        - flipTo
        - probabilityShift
      properties:
        feature:
          type: string
          example: Cortical Thickness
        deltaDirection:
          type: string
          enum: [increase, decrease]
        percentChange:
          type: number
          example: 20
        flipTo:
          type: string
          enum: [metastasis, paget, oi, healthy]
        probabilityShift:
          type: number
          example: 0.18

    FractureRiskResult:
      type: object
      required:
        - level
        - percent
      properties:
        level:
          type: string
          enum: [low, medium, high]
        percent:
          type: number
          minimum: 0
          maximum: 100

    FeedbackPayload:
      type: object
      required:
        - requestId
        - decision
        - timestamp
      properties:
        requestId:
          type: string
        decision:
          type: string
          enum: [agree, disagree, unsure]
        predictedClass:
          type: string
        reasonCode:
          type: string
          enum: [artifact, insufficient_context, missed_lesion, class_confusion, other]
        reasonText:
          type: string
        timestamp:
          type: string
          format: date-time

    FeedbackRecord:
      allOf:
        - $ref: '#/components/schemas/FeedbackPayload'
        - type: object
          properties:
            feedbackId:
              type: string

    FeedbackStatsResponse:
      type: object
      required:
        - total
        - agree
        - disagree
        - unsure
        - disagreementRate
      properties:
        total:
          type: integer
        agree:
          type: integer
        disagree:
          type: integer
        unsure:
          type: integer
        disagreementRate:
          type: number
        byClass:
          type: object
          additionalProperties:
            type: object
            properties:
              agree:
                type: integer
              disagree:
                type: integer
              unsure:
                type: integer

    EventPayload:
      type: object
      required:
        - type
        - timestamp
      properties:
        type:
          type: string
          example: gradcam_toggle
        requestId:
          type: string
        timestamp:
          type: string
        metadata:
          type: object
          additionalProperties: true

    JobStatusResponse:
      type: object
      required:
        - id
        - status
        - progress
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, processing, done, failed]
        progress:
          type: number
          minimum: 0
          maximum: 100
        resultUrl:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
        code:
          type: string
          enum: [VALIDATION_ERROR, TIMEOUT_ERROR, NETWORK_ERROR, SERVER_ERROR]
        details:
          type: string

    DatasetSourcesResponse:
      type: object
      required: [timestamp, ontology_version, total_sources, approved_sources_count, sources]
      properties:
        timestamp:
          type: string
          format: date-time
        ontology_version:
          type: string
        total_sources:
          type: integer
        identified_sources_count:
          type: integer
        verified_external_or_in_tree_candidates_count:
          type: integer
        approved_sources_count:
          type: integer
        rejected_sources_count:
          type: integer
        sources:
          type: array
          items:
            type: object
            additionalProperties: true
        disclaimer:
          type: string

    DatasetAcquisitionStatusResponse:
      type: object
      required: [timestamp, overall_acquisition_status, cohorts, total_validated_patients, total_received_valid_images]
      properties:
        timestamp:
          type: string
          format: date-time
        overall_acquisition_status:
          type: string
        workflow_stages:
          type: array
          items:
            type: string
        exception_states:
          type: array
          items:
            type: string
        cohorts:
          type: array
          items:
            type: object
            additionalProperties: true
        total_validated_patients:
          type: integer
        total_received_valid_images:
          type: integer
        protected_holdouts:
          type: object
          additionalProperties: true

    DatasetGovernanceStatusResponse:
      type: object
      required: [timestamp, governance_gate_status, approved_sources_count, pending_ethics_approvals_count, pending_duas_count]
      properties:
        timestamp:
          type: string
          format: date-time
        governance_gate_status:
          type: string
        active_sources_audited:
          type: integer
        approved_sources_count:
          type: integer
        pending_ethics_approvals_count:
          type: integer
        pending_duas_count:
          type: integer
        expired_approvals_count:
          type: integer
        mean_evidence_completeness_pct:
          type: number
        templates_status:
          type: string
        available_templates:
          type: array
          items:
            type: string
        source_audits:
          type: array
          items:
            type: object
            additionalProperties: true

    CohortPlanningResponse:
      type: object
      required: [timestamp, ontology_version, synthetic_data_excluded, totals, planned_cohorts]
      properties:
        timestamp:
          type: string
          format: date-time
        ontology_version:
          type: string
        synthetic_data_excluded:
          type: boolean
        statistical_sample_size_justification_ref:
          type: string
        statistical_adequacy_status:
          type: string
        totals:
          type: object
          additionalProperties: true
        planned_cohorts:
          type: array
          items:
            type: object
            additionalProperties: true

    WorkflowTransitionRequest:
      type: object
      required: [source_id, target_state, reviewer_pseudo_id, reviewer_role, reason, evidence_reference]
      properties:
        source_id:
          type: string
        target_state:
          type: string
        reviewer_pseudo_id:
          type: string
        reviewer_role:
          type: string
        reason:
          type: string
        evidence_reference:
          type: string
