[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osteoguard"
version = "1.0.0"
description = "A Unified Deep Learning and Radiomic Framework for Differential Diagnosis and Biomechanical Fracture Risk Stratification"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "OsteoGuard AI Architecture Team" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "scikit-image>=0.20.0",
    "opencv-python-headless>=4.7.0",
    "pydicom>=3.0.0",
    "nibabel>=5.0.0",
    "imagehash>=4.3.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pillow>=9.5.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "shap>=0.42.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests_ml", "ml_service/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

