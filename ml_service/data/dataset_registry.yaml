# ------------------------------------------------------------------------------
# 1. Target Pathology Taxonomy & Strict Negative Mapping Rules
# ------------------------------------------------------------------------------
target_classes:
  secondary_bone_metastasis:
    canonical_name: "secondary_bone_metastasis"
    short_code: "metastasis"
    class_index: 0
    icd10_code: "C79.51"
    clinical_definition: >
      Secondary osteolytic, osteoblastic, or mixed metastatic osseous lesions
      originating from extra-skeletal primary carcinomas (breast, prostate, lung, kidney, thyroid).
    strict_exclusion_rules:
      - "NEVER map primary malignant bone tumours (Osteosarcoma, Ewing's sarcoma, Chondrosarcoma) to secondary metastasis."
      - "NEVER map multiple myeloma or haematological bone malignancies to secondary carcinoma metastasis without explicit clinical tagging."
      - "NEVER map benign enchondromas or bone cysts as metastatic lesions."

  pagets_disease:
    canonical_name: "pagets_disease"
    short_code: "paget"
    class_index: 1
    icd10_code: "M88.0-M88.9"
    clinical_definition: >
      Chronic osteometabolic disorder characterized by disordered, accelerated bone remodeling,
      loss of corticomedullary differentiation, 'cotton-wool' skull appearance, and trabecular coarsening.
    strict_exclusion_rules:
      - "NEVER map generic abnormal radiographs, severe osteoarthritis, or subchondral sclerosis to Paget's disease."
      - "NEVER map fibrous dysplasia, osteopetrosis, or hyperparathyroidism 'brown tumours' to Paget's disease."
      - "Requires radiologist-confirmed Pagetic skeletal diagnosis."

  osteogenesis_imperfecta:
    canonical_name: "osteogenesis_imperfecta"
    short_code: "oi"
    class_index: 2
    icd10_code: "Q78.0"
    clinical_definition: >
      Heritable connective tissue disorder caused by COL1A1/COL1A2 mutations resulting
      in quantitative or qualitative type I collagen defects, severe osseous fragility, bowing, and osteopenia.
    strict_exclusion_rules:
      - "NEVER map post-menopausal, senile, or disuse osteoporosis to osteogenesis imperfecta."
      - "NEVER map rickets, osteomalacia, or non-accidental trauma to osteogenesis imperfecta."
      - "Requires verified pediatric or adult clinical/genetic OI diagnosis."

  healthy_control:
    canonical_name: "healthy_control"
    short_code: "healthy"
    class_index: 3
    icd10_code: "Z00.00"
    clinical_definition: >
      Asymptomatic skeletal controls demonstrating anatomical integrity, normal bone mineral density,
      and absolute absence of focal lesions, fractures, or metabolic remodeling.
    strict_exclusion_rules:
      - "NEVER assume unaffected or contralateral limb scans from cancer patients are healthy controls."
      - "NEVER map asymptomatic radiographs with degenerative joint changes or mild osteopenia as healthy controls."
      - "Requires verified radiologically normal skeletal reading."

# ------------------------------------------------------------------------------
# 2. Registered Data Sources Dossier
# ------------------------------------------------------------------------------
sources:
