    url: "https://www.cancerimagingarchive.net/collection/spine-mets-ct-seg/"
    doi: "10.7937/TCIA.V2WY-KG44"
    available_format: "DICOM, NIfTI (v3/segmentations)"
    available_modality: "Computed Tomography (CT)"
    available_labels: "Pathologist-confirmed secondary spinal metastases (breast, lung, prostate, renal); individual vertebral segmentations."
    patient_level_metadata: "Fully anonymized TCIA subject IDs (e.g., Spine-Mets-001); patient age, biological sex, primary cancer site."
    segmentation_annotations: "Voxel-level 3D binary masks of metastatic osteolytic/osteoblastic lesions and anatomical vertebra bodies."
    download_method: "TCIA NBIA Data Retriever (.tcia manifest file) or RESTful API"
    access_category: "RESTRICTED_APPROVAL"
    license: "Creative Commons Attribution 4.0 International (CC BY 4.0) with TCIA Restricted Data Use Agreement"
    intended_ml_use: "Training deep 3D/2D axial semantic backbone (ResNet-101/Swin-T), U-Net segmentation, and CT radiomics."
