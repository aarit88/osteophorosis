# ==============================================================================
# OsteoGuard AI - GPU-Optimized Training Configuration Specification
# Model: FracAtlas ResNet-101 Binary Fracture Classification
# Target Hardware: NVIDIA GeForce RTX 3050 Laptop GPU (4,094 MiB VRAM)
# ==============================================================================
experiment_name: "fracatlas_resnet101_gpu_fracture"
version: "1.0.0"
date_created: "2026-11-15"

# ------------------------------------------------------------------------------
# 1. Model Architecture
# ------------------------------------------------------------------------------
model:
  architecture: "resnet101"
  backbone: "ResNet-101"
  num_classes: 2
  in_channels: 3
  pretrained: false  # Safe initialization; ImageNet weights optional upon verification
  dropout_rate: 0.2
  pooling: "AdaptiveAvgPool2d(1, 1)"
  head: "Linear(2048, 2)"

# ------------------------------------------------------------------------------
# 2. Dataset & Input Dimensions
# ------------------------------------------------------------------------------
dataset:
  name: "fracatlas"
  task: "binary_acute_fracture_classification"
  manifest_path: "ml_service/data/splits/fracatlas_classification_split.csv"
  target_classes:
    0: "candidate_control_radiograph"
    1: "acute_bone_fracture"
  input_dimensions:
    channels: 3
    height: 224
    width: 224
  class_balance:
    fractured: 719
    non_fractured: 3364
    imbalance_ratio: 4.6787  # 3364 / 719

# ------------------------------------------------------------------------------
# 3. Memory-Aware DataLoader (Strictly Tuned for 4 GB VRAM)
# ------------------------------------------------------------------------------
dataloader:
  batch_size: 2          # Conservative batch size strictly safeguarding 4GB VRAM
  num_workers: 0         # Windows multiprocess child worker safety
  pin_memory: true       # Faster host-to-device CUDA memory transfer
  shuffle_train: true
  drop_last: false

# ------------------------------------------------------------------------------
# 4. Optimization & Hyperparameters (with Gradient Accumulation)
# ------------------------------------------------------------------------------
training:
  epochs: 30
  random_seed: 42
  gradient_accumulation_steps: 8  # Effective batch size = 2 * 8 = 16
  optimizer:
    name: "AdamW"
    learning_rate: 0.0001
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1.0e-8
  lr_scheduler:
    name: "CosineAnnealingLR"
    T_max: 30
    eta_min: 1.0e-6
  loss:
    name: "CrossEntropyLoss"
    label_smoothing: 0.05
    use_class_weights: true
    class_weights: [1.0, 4.68]  # Up-weights minority fracture class
  early_stopping:
    enabled: true
    patience: 7
    metric: "val_loss"
    mode: "min"
    min_delta: 0.0001

# ------------------------------------------------------------------------------
# 5. GPU & Mixed Precision Engine
# ------------------------------------------------------------------------------
hardware:
  device: "cuda"
  gpu_device_id: 0
  gpu_name: "NVIDIA GeForce RTX 3050 Laptop GPU"
  total_vram_mb: 4094
  vram_safety_headroom_mb: 512
  mixed_precision: true       # Automatic Mixed Precision (AMP FP16)
  amp_dtype: "float16"
  grad_scaler: true
  empty_cache_frequency_batches: 50

# ------------------------------------------------------------------------------
# 6. Checkpoint & Artifact Governance
# ------------------------------------------------------------------------------
checkpoints:
  checkpoint_dir: "ml_artifacts/checkpoints/fracatlas_gpu"
  save_best_only: true
  save_frequency_epochs: 1
  monitor_metric: "val_loss"
  keep_top_k: 3

logging:
  log_dir: "ml_artifacts/logs/fracatlas_gpu"
  log_interval_batches: 20
  log_vram_usage: true
  metrics_output: "ml_artifacts/metrics/fracatlas_gpu_training_metrics.json"

